name: ci
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22.23.0'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run coverage
      - run: npm run build
      - run: npm pack
      - name: Verify public exports from the actual archive
        run: |
          package_archive=$(realpath sara-fan-ui-shared-*.tgz)
          scratch=$(mktemp -d)
          cd "$scratch"
          npm init -y
          npm install "$package_archive"
          node --input-type=module -e "import { ProblemError } from '@sara-fan/ui-shared/problems'; import { createHttpTools } from '@sara-fan/ui-shared/http'; if (!ProblemError || !createHttpTools) process.exit(1)"
