name: ci

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: '${{ github.workflow }}-${{ github.head_ref || github.ref }}'
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22.23.0'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Test with coverage
        run: npm run coverage
      - name: Verify package build
        run: npm run build
      - name: Pack release archive
        run: npm pack
      - name: Verify public exports from the actual archive
        run: |
          package_archive=$(realpath sara-fan-ui-shared-*.tgz)
          scratch=$(mktemp -d)
          cd "$scratch"
          npm init -y
          npm install "$package_archive"
          node --input-type=module -e "import { ProblemError } from '@sara-fan/ui-shared/problems'; import { createHttpTools } from '@sara-fan/ui-shared/http'; if (!ProblemError || !createHttpTools) process.exit(1)"
