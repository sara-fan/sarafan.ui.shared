name: release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22.23.0'
          cache: npm
      - name: Verify tag matches package version
        run: |
          version=$(node -p "require('./package.json').version")
          case "$GITHUB_REF_NAME" in
            "v$version"|"v$version-"*) ;;
            *) echo "Tag must match the package version" >&2; exit 1 ;;
          esac
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Test with coverage
        run: npm run coverage
      - name: Pack release archive
        run: npm pack
      - name: Generate archive checksum
        run: sha256sum sara-fan-ui-shared-*.tgz > SHA256SUMS
      - name: Publish immutable artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=()
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then flags+=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" sara-fan-ui-shared-*.tgz SHA256SUMS --verify-tag --title "$GITHUB_REF_NAME" --generate-notes "${flags[@]}"
